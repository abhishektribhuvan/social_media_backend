services:
  api:
    build: .
    ports:
      - "8001:8000"
    #auto update code on the imeges
    volumes:
      - ./:/app:ro #select file which we want to update automatically 

    env_file:
      - .env
    environment:
      DATABASE_HOSTNAME: postgres

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: posta
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-db: