      #     cache-to: type=gha,mode=max

      # - name: Image digest
      #   run: echo ${{ steps.docker_build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build] # needs make somthing run before this all jobs run parallel so to make them in series we use this 

    steps:
      - name: deploying stuff
        run: echo "going to deploy"